id: btc-dashboard
title: "BTC Mining Dashboard"
version: 1.0.1.0
release-notes: "Fix ES module wiring: window.* globals, scenario loader, chart canvas IDs, missing imports."
license: mit
wrapper-repo: "https://github.com/Dazy-hub/BTC-Mining-Dashboard"
upstream-repo: "https://github.com/Dazy-hub/BTC-Mining-Dashboard"
support-site: "https://github.com/Dazy-hub/BTC-Mining-Dashboard/issues"
marketing-site: "https://github.com/Dazy-hub/BTC-Mining-Dashboard"
build: ["make"]
min-os-version: "0.3.5"

description:
  short: "Live Bitcoin mining dashboard for OCEAN pool miners"
  long: |
    Real-time Bitcoin mining dashboard with five pages: Live network stats,
    OCEAN pool, Network governance (BIP-110, Knots, Hash Ribbon), My Stats,
    and Hashprice index. All external API calls proxied through nginx.
    Chart.js bundled locally — no CDN required at runtime.

assets:
  license: LICENSE
  icon: icon.png
  instructions: INSTRUCTIONS.md
  docker-images: image.tar

main:
  type: docker
  image: main
  entrypoint: "docker_entrypoint.sh"
  args: []
  mounts:
    main: /root

health-checks:
  web-ui:
    name: "Web Interface"
    description: "Checks that the dashboard web server is responding"
    type: docker
    image: main
    entrypoint: sh
    args:
      - "-c"
      - "wget -qO- http://localhost/health || exit 1"
    inject: true
    system: false
    io-format: json

config: ~
properties: ~

volumes:
  main:
    type: data

interfaces:
  main:
    name: "Dashboard UI"
    description: "Bitcoin mining dashboard — opens in your browser"
    tor-config:
      port-mapping:
        80: "80"
    lan-config:
      443:
        ssl: true
        internal: 80
    ui: true
    protocols:
      - tcp
      - http

dependencies: {}

alerts: {}
actions: {}

backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /root/data
    mounts:
      BACKUP: /mnt/backup
      main: /root
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /root/data
    mounts:
      BACKUP: /mnt/backup
      main: /root
