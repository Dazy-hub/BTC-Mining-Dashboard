server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    
    
    
    
    
    # Resolver injected at startup by docker_entrypoint.sh from /etc/resolv.conf
    resolver __RESOLVER__ valid=30s;

    # ── Dashboard SPA ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Proxy: mempool.space ──────────────────────────────────────────────────
    location /proxy/mempool/ {
        set $upstream "mempool.space";
        rewrite ^/proxy/mempool/(.*)$ /api/$1 break;
        proxy_pass            https://$upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;
        proxy_set_header      Host          $upstream;
        proxy_set_header      X-Real-IP     $remote_addr;
        proxy_set_header      Origin        "";
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin * always;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
    }

    # ── Proxy: ocean.xyz ──────────────────────────────────────────────────────
    location /proxy/ocean/ {
        set $upstream "ocean.xyz";
        rewrite ^/proxy/ocean/(.*)$ /$1 break;
        proxy_pass            https://$upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;
        proxy_set_header      Host             $upstream;
        proxy_set_header      X-Real-IP        $remote_addr;
        proxy_set_header      Origin           "";
        proxy_set_header      User-Agent       "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
        proxy_set_header      Accept           "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8";
        proxy_set_header      Accept-Language  "en-US,en;q=0.5";
        proxy_set_header      Referer          "https://ocean.xyz/";
        proxy_hide_header     X-Frame-Options;
        proxy_hide_header     Content-Security-Policy;
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin * always;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
    }

    # ── Proxy: bip110monitor.com ──────────────────────────────────────────────
    location /proxy/bip110 {
        set $upstream "bip110monitor.com";
        rewrite ^/proxy/bip110(.*)$ /api$1 break;
        proxy_pass            https://$upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;
        proxy_set_header      Host          $upstream;
        proxy_set_header      X-Real-IP     $remote_addr;
        proxy_set_header      Origin        "";
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin * always;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
    }

    # ── Proxy: bitnodes.io ────────────────────────────────────────────────────
    # JS fetches: /proxy/bitnodes/snapshots/?page=1
    #             /proxy/bitnodes/snapshots/<ts>/?field=user_agents
    # rewrite strips /proxy/bitnodes/ and prepends /api/v1/
    location /proxy/bitnodes/ {
        set $upstream "bitnodes.io";
        rewrite ^/proxy/bitnodes/(.*)$ /api/v1/$1 break;
        proxy_pass            https://$upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;
        proxy_set_header      Host          $upstream;
        proxy_set_header      X-Real-IP     $remote_addr;
        proxy_set_header      Origin        "";
        proxy_set_header      Accept        "application/json";
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin * always;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }

    # ── Proxy: blockchain.info ────────────────────────────────────────────────
    location /proxy/blockchaininfo/ {
        set $upstream "blockchain.info";
        rewrite ^/proxy/blockchaininfo/(.*)$ /$1 break;
        proxy_pass            https://$upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;
        proxy_set_header      Host          $upstream;
        proxy_set_header      X-Real-IP     $remote_addr;
        proxy_set_header      Origin        "";
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin * always;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
    }

    # ── Proxy: CoinGecko ──────────────────────────────────────────────────────
    location /proxy/coingecko/ {
        set $upstream "api.coingecko.com";
        rewrite ^/proxy/coingecko/(.*)$ /$1 break;
        proxy_pass            https://$upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;
        proxy_set_header      Host          $upstream;
        proxy_set_header      X-Real-IP     $remote_addr;
        proxy_set_header      Origin        "";
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin * always;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
    }
}
